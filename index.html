<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مكان MAKAN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE occasion: a private-banking gateway for real estate investors, hushed and exact
   IDEA an embossed investor passport opening a Najdi gate onto the Riyadh skyline
   PICTURE dusk skyline (Kingdom Centre, Al Faisaliyah) behind a crenellated Najdi wall; passport card; drawn map
   COLOUR deep emerald ground, warm white, burnished gold accent; night = same emerald world
   TYPE Reem Kufi (Kufic display) + IBM Plex Sans Arabic, Inter for Latin labels
   LAYOUT laptop: full-bleed scene, title in the sky corner; phone: title, scene, actions stacked */
:root{color-scheme:light dark;--bg:light-dark(#fbf8f2,#061612);--ink:light-dark(#12231e,#ece5d6);--mut:light-dark(#5a6862,#9eb1a8);--card:light-dark(#ffffff,#0b211b);--sand:light-dark(#f3ecdf,#0e2720);--line:light-dark(#e6ddcb,#1e3b32);--em:#0a3a30;--em2:light-dark(#0d5544,#3fa489);--gold:light-dark(#9c7330,#d6ad62);--goldf:#c9a05a;--red:light-dark(#a3322a,#e57a70)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "IBM Plex Sans Arabic",Tahoma,sans-serif;overflow-x:clip}
h1,h2,h3,.kufi{font-family:"Reem Kufi","IBM Plex Sans Arabic",sans-serif;font-weight:700;letter-spacing:-.01em;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(34px,5vw,58px)}
h2{font-size:clamp(28px,3.4vw,40px)}
h3{font-size:20px}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1240px;margin:0 auto}
.band{padding-block:clamp(36px,5vw,72px);padding-left:max(5vw,16px);padding-right:max(5vw,16px)}
.mut{color:var(--mut)}
.en{font-family:Inter,"IBM Plex Sans Arabic",sans-serif;unicode-bidi:isolate;font-size:13px;color:var(--mut)}
.hide{display:none!important}
/* top bar */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--em) 96%,transparent);backdrop-filter:blur(8px);color:#f2ead9;border-bottom:1px solid #ffffff14}
.top .wrap{display:flex;align-items:center;gap:14px;padding:10px max(5vw,16px);flex-wrap:wrap;max-width:none}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand b{font-family:"Reem Kufi";font-size:28px;line-height:1}
.brand small{display:block;font:600 11px/1 Inter,sans-serif;color:var(--goldf);letter-spacing:.2em}
.nav{display:flex;gap:2px;margin-inline-start:auto;overflow-x:auto;scrollbar-width:none}
.nav a{flex:none;text-decoration:none;padding:10px 11px;border-radius:999px;color:#cfdcd4;font-weight:500;font-size:14.5px;min-height:44px;display:flex;align-items:center}
.nav a:hover{color:#fff;background:#ffffff12}
.nav a.on{color:#0a3a30;background:var(--goldf)}
.tools{display:flex;gap:8px;align-items:center}
.lang{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid #ffffff38;background:transparent;color:#f2ead9;cursor:pointer;font-weight:600}
.lang:hover{border-color:var(--goldf)}
.acct{display:flex;align-items:center;gap:8px;min-height:40px;padding:3px 12px 3px 4px;border-radius:999px;background:#ffffff14;text-decoration:none;color:#f2ead9;font-size:14px;font-weight:600;max-width:200px}
[dir=rtl] .acct{padding:3px 4px 3px 12px}
.acct img{width:32px;height:32px;border-radius:50%;flex:none}
.acct span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct.out{background:var(--goldf);color:#14241f;padding:0 16px}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:12px;border:1px solid transparent;font-weight:600;cursor:pointer;text-decoration:none;transition:transform .15s}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.gold{background:var(--goldf);color:#14241f}
.btn.gold:hover{background:#d9b36d}
.btn.ghost{border-color:#ffffff40;color:#f2ead9;background:#ffffff0a}
.btn.line{border-color:var(--line);background:var(--card)}
.btn.line:hover{border-color:var(--gold)}
.btn.em{background:var(--em2);color:#fff}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px;border-radius:10px}
.btn.danger{border-color:color-mix(in srgb,var(--red) 40%,transparent);color:var(--red);background:var(--card)}
.btn.danger.arm{background:var(--red);color:#fff}
:focus-visible{outline:3px solid var(--goldf);outline-offset:2px}
.page{display:none}.page.on{display:block}
/* hero */
.hero{position:relative;background:var(--em);color:#f4ecdc;overflow:hidden;min-height:clamp(520px,78vh,720px)}
.hero svg.scene{position:absolute;inset:0;width:100%;height:100%}
[dir=ltr] .hero svg.scene{transform:scaleX(-1)}
.hero:after{content:"";position:absolute;inset:0 0 0 35%;background:linear-gradient(270deg,#05251dcc 0,#05251d88 45%,transparent);pointer-events:none;z-index:1}
[dir=ltr] .hero:after{inset:0 35% 0 0;background:linear-gradient(90deg,#05251dcc 0,#05251d88 45%,transparent)}
.hero .txt{position:relative;z-index:2;max-width:580px;padding:clamp(40px,7vw,96px) max(5vw,16px) 0}
.hero p.lead{font-size:18px;color:#d5e1d9;margin:18px 0 26px;max-width:46ch}
.hero .acts{display:flex;gap:12px;flex-wrap:wrap}
.hero .en{color:#a9c2b8;margin-top:8px;display:block}
/* sections */
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;margin-bottom:28px}
.sec-head p{max-width:60ch}
.svc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.svc a{background:var(--card);padding:26px;text-decoration:none;display:flex;flex-direction:column;gap:10px;min-height:210px;transition:background .2s}
.svc a:hover{background:var(--sand)}
.svc a.hub{background:var(--em);color:#f2ead9}
.svc a.hub .mut{color:#b9cbc3}
.svc svg{width:44px;height:44px;color:var(--gold)}
.svc .go{margin-top:auto;font-weight:600;color:var(--gold)}
.svc a.hub .go{color:var(--goldf)}
.route{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:relative;gap:12px;margin-top:8px}
.route:before{content:"";position:absolute;top:27px;right:8%;left:8%;height:2px;background:repeating-linear-gradient(90deg,var(--gold) 0 10px,transparent 10px 18px)}
.stn{position:relative;text-align:center;padding:0 6px}
.stn .dot{width:56px;height:56px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;background:var(--card);border:2px solid var(--gold);font:700 20px "Reem Kufi";color:var(--gold);position:relative}
.stn.cur .dot{background:var(--gold);color:var(--card);box-shadow:0 0 0 6px color-mix(in srgb,var(--gold) 22%,transparent)}
.stn.done .dot{background:var(--em2);border-color:var(--em2);color:#fff}
.stn h3{font-size:17px}
.stn p{font-size:14px;color:var(--mut)}
.cta{background:var(--em);color:#f2ead9}
.cta .wrap{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:32px;align-items:center}
.cta p{color:#c4d4cc}
.note{border-inline-start:3px solid var(--gold);background:var(--sand);padding:14px 18px;border-radius:10px;font-size:14px;color:var(--mut);margin-top:22px}
footer{background:#04110d;color:#a9bcb3;padding:44px max(5vw,16px) 28px;font-size:14px}
footer .wrap{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:28px}
footer h4{color:#f2ead9;margin:0 0 10px;font-size:15px}
footer a{display:block;text-decoration:none;padding:3px 0}
footer a:hover{color:var(--goldf)}
footer .base{border-top:1px solid #ffffff14;margin-top:28px;padding-top:18px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
.phead{background:var(--em);color:#f2ead9;padding:clamp(28px,4vw,48px) max(5vw,16px)}
.phead p{color:#c4d4cc;max-width:62ch;margin-top:8px}
.phead .en{color:#9fbab0}
/* forms */
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,2.5vw,28px)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;font-weight:600}
input,select,textarea{font-size:16px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-height:46px;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 25%,transparent)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;align-items:center}
.two{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;align-items:start}
.ai2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.sticky{position:sticky;top:90px}
.saveinfo{font-size:13px;color:var(--mut)}
/* passport */
.pp{aspect-ratio:1.42;border-radius:20px;background:radial-gradient(120% 90% at 85% 0%,#14614f,#0a3a30 55%,#062a22);color:#efe2c4;padding:clamp(18px,3vw,30px);position:relative;overflow:hidden;box-shadow:0 24px 50px -28px #062a22;display:flex;flex-direction:column}
.pp .pat{position:absolute;inset:0;opacity:.16}
.pp .row1{display:flex;justify-content:space-between;align-items:start;position:relative}
.pp .ttl{font:700 clamp(18px,2.4vw,24px) "Reem Kufi";color:var(--goldf)}
.pp .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 20px;margin-top:auto;position:relative}
.pp .k{font-size:11px;color:#bcae8c}
.pp .v{font-weight:600;font-size:clamp(13px,1.6vw,15px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pp .mrz{font:600 clamp(9px,1.3vw,12px)/1.5 "Courier New",monospace;direction:ltr;color:#d8c79e;margin-top:12px;letter-spacing:.06em;position:relative;white-space:nowrap;overflow:hidden}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;min-height:40px;cursor:pointer;font-size:14px;text-align:start}
.chip:hover{border-color:var(--gold);background:var(--sand)}
/* chat */
.chatbox{display:flex;flex-direction:column;height:min(640px,75vh);padding:0;overflow:hidden}
.chathead{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);gap:10px;flex-wrap:wrap}
.msgs{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:14px}
.m{max-width:86%;padding:13px 16px;border-radius:16px;line-height:1.85;font-size:15.5px}
.m.bot{background:var(--sand);align-self:flex-start;border-start-start-radius:4px}
.m.me{background:var(--em2);color:#fff;align-self:flex-end;border-start-end-radius:4px;white-space:pre-wrap}
.m ul{margin:6px 0;padding-inline-start:20px}
.m p+p{margin-top:8px}
.m .tool{font-size:12px;color:var(--gold);display:block;margin-bottom:4px}
.compose{display:flex;gap:10px;padding:14px;border-top:1px solid var(--line);background:var(--card)}
.compose textarea{resize:none;min-height:48px;max-height:140px}
.status{font-size:13px;display:flex;align-items:center;gap:8px}
.status i{width:9px;height:9px;border-radius:50%;background:#c9a05a;display:inline-block}
.status.live i{background:#2fb487}
.side .grp{margin-top:18px}
.side .grp b{display:block;font-size:14px;margin-bottom:8px;color:var(--gold)}
/* providers */
.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:14px}
.plist{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:20px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:10px;transition:border-color .2s}
.pc:hover{border-color:var(--gold)}
.pc .hd{display:flex;gap:12px;align-items:center}
.mono{width:52px;height:52px;border-radius:14px;background:var(--em);color:var(--goldf);display:grid;place-items:center;font:700 22px "Reem Kufi";flex:none}
.tag{display:inline-block;font-size:12px;padding:4px 10px;border-radius:999px;background:var(--sand);color:var(--mut);margin-block:2px;margin-inline-end:4px;text-decoration:none}
.tag.warn{background:color-mix(in srgb,var(--gold) 16%,transparent);color:var(--gold)}
.tag.ok{background:color-mix(in srgb,var(--em2) 16%,transparent);color:var(--em2)}
.pc .acts{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap}
.joinband{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;margin-top:28px;background:var(--em);color:#f2ead9;border-radius:20px;padding:26px}
.joinband p{color:#c4d4cc}
dialog{border:0;border-radius:22px;padding:0;max-width:min(640px,94vw);width:100%;background:var(--card);color:var(--ink)}
dialog::backdrop{background:#03110dcc}
.dlg-h{background:var(--em);color:#f2ead9;padding:24px;display:flex;gap:14px;align-items:center}
.dlg-b{padding:24px;display:grid;gap:16px}
.x{margin-inline-start:auto;background:#ffffff14;border:0;border-radius:10px;width:44px;height:44px;color:#fff;cursor:pointer;font-size:20px}
/* map */
.mapw{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:24px;align-items:start}
.fig{position:relative;min-height:480px;background:radial-gradient(circle at 60% 45%,color-mix(in srgb,var(--em2) 10%,var(--card)),var(--card));border:1px solid var(--line);border-radius:20px;overflow:hidden}
.fig>svg{position:absolute;inset:0;width:100%;height:100%;direction:ltr}
.fig svg text{paint-order:stroke;stroke:var(--card);stroke-width:4px;font-family:"IBM Plex Sans Arabic",Inter;font-weight:600}
.pin{cursor:pointer}
.clist{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.crow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
/* costs */
.calc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}
.opt{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:12px;cursor:pointer;background:var(--bg)}
.opt input,.task input{width:22px;height:22px;min-height:0;accent-color:#0d5544;flex:none}
.opt .rng{margin-inline-start:auto;white-space:nowrap;font-size:14px;color:var(--mut);font-variant-numeric:tabular-nums}
.big{font:700 clamp(34px,5vw,54px)/1.05 "Reem Kufi";color:var(--gold);white-space:nowrap}
.bars{display:flex;flex-direction:column;gap:12px;margin-top:22px}
.bar .lb{display:flex;justify-content:space-between;font-size:14px;gap:10px}
.bar .lb span:last-child{white-space:nowrap;font-variant-numeric:tabular-nums}
.bar .tr{height:12px;background:var(--sand);border-radius:99px;position:relative;margin-top:6px}
.bar .fl{position:absolute;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--em2))}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-height:44px;border:1px solid var(--line);background:var(--bg);border-radius:10px;cursor:pointer}
.seg button.on{background:var(--em2);color:#fff;border-color:var(--em2)}
/* journey */
.stage{display:grid;grid-template-columns:80px minmax(0,1fr);gap:20px;padding:22px 0;border-bottom:1px solid var(--line)}
.stage .n{font:700 44px/1 "Reem Kufi";color:var(--gold)}
.stage.cur .n{color:var(--em2)}
.task{display:flex;gap:12px;align-items:center;padding:8px 0;cursor:pointer}
.prog{height:12px;border-radius:99px;background:var(--sand);overflow:hidden;margin:10px 0}
.prog span{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--em2));transition:width .4s}
/* account & admin */
.who{display:flex;gap:18px;align-items:center}
.who img{width:76px;height:76px;border-radius:50%;flex:none;border:3px solid var(--goldf)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:22px}
.facts div{background:var(--card);padding:16px}
.facts b{display:block;font-size:13px;color:var(--mut);font-weight:500}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:start;padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:13px;color:var(--mut);font-weight:600}
td .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.app{border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:8px;background:var(--bg)}
.toast{position:fixed;bottom:22px;left:22px;z-index:60;background:#0a3a30;color:#f2ead9;padding:14px 20px;border-radius:12px;box-shadow:0 10px 30px #0006;opacity:0;transform:translateY(10px);transition:.3s;pointer-events:none;max-width:calc(100vw - 44px)}
.toast.on{opacity:1;transform:none}
@media(max-width:980px){.svc,.plist{grid-template-columns:repeat(2,minmax(0,1fr))}footer .wrap{grid-template-columns:1fr 1fr}}
@media(max-width:820px){.two,.ai2,.mapw,.calc,.cta .wrap,.joinband{grid-template-columns:1fr}.sticky{position:static}.filters{grid-template-columns:1fr 1fr}.filters .field:first-child{grid-column:1/-1}.facts{grid-template-columns:1fr}}
@media(max-width:600px){.hero:after{display:none}.svc,.plist,.fgrid{grid-template-columns:1fr}.route{grid-template-columns:1fr;gap:0}.route:before{top:0;bottom:0;right:27px;left:auto;width:2px;height:auto;background:repeating-linear-gradient(180deg,var(--gold) 0 10px,transparent 10px 18px)}[dir=ltr] .route:before{left:27px;right:auto}.stn{display:grid;grid-template-columns:56px 1fr;gap:0 14px;text-align:start;padding:8px 0}.stn .dot{margin:0;grid-row:span 2}.hero{min-height:0;display:flex;flex-direction:column}.hero .txt{padding-top:32px}.hero svg.scene{position:relative;order:1;height:300px;margin-top:24px}.opt{flex-wrap:wrap}.opt .rng{width:100%;margin-inline-start:34px}.stage{grid-template-columns:52px 1fr}.stage .n{font-size:32px}.m{max-width:94%}.fig{min-height:380px}.top .wrap{gap:8px}.nav{order:3;margin-inline-start:0;width:100%}.tools{margin-inline-start:auto}.acct span{display:none}[dir] .acct{padding:4px}.acct.out span{display:inline}[dir] .acct.out{padding:0 14px}table{font-size:14px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flex;justify-content:space-between;gap:12px;border:0;padding:4px 0}.stack td::before{content:attr(data-l);color:var(--mut);font-size:13px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@keyframes tw{50%{opacity:.25}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="#home" aria-label="MAKAN">
    <svg width="38" height="38" viewBox="0 0 40 40" aria-hidden="true"><path d="M4 38V16l4-5 4 5 4-5 4 5 4-5 4 5 4-5 4 5v22z" fill="#c9a05a"/><path d="M14 38V26a6 6 0 0 1 12 0v12z" fill="#0a3a30"/><path d="M18 20l2-3 2 3z" fill="#0a3a30"/></svg>
    <span><b data-t="brand">مَكان</b><small>MAKAN</small></span>
  </a>
  <nav class="nav" id="nav">
    <a href="#home" data-t="nav_home"></a><a href="#passport" data-t="nav_pass"></a><a href="#assistant" data-t="nav_ai"></a><a href="#experts" data-t="nav_exp"></a><a href="#map" data-t="nav_map"></a><a href="#costs" data-t="nav_costs"></a><a href="#journey" data-t="nav_jr"></a><a href="#admin" data-t="nav_admin" class="hide" id="navAdmin"></a>
  </nav>
  <div class="tools"><button class="lang" id="langBtn" type="button" data-t="lang_btn"></button><a class="acct out" id="acct" href="#account"><span data-t="signin"></span></a></div>
</div></header>

<main>
<section class="page" id="p-home">
  <div class="hero">
    <svg class="scene" id="scene" viewBox="0 0 1440 640" preserveAspectRatio="xMidYMax slice" aria-hidden="true"></svg>
    <div class="txt">
      <h1 data-t="hero_h"></h1><span class="en" data-t="hero_sub"></span>
      <p class="lead" data-t="hero_p"></p>
      <div class="acts"><a class="btn gold" href="#passport" data-t="hero_b1"></a><a class="btn ghost" href="#assistant" data-t="hero_b2"></a></div>
    </div>

function renderOpts(){$('#optList').innerHTML=COSTS.map(c=>`<label class="opt"><input type="checkbox" data-k="${c.k}" ${SEL.has(c.k)?'checked':''}><span>${tx(c)}</span><span class="rng">${fmt(c.lo)}–${fmt(c.hi)} ${t('sar')}</span></label>`).join('')}
$('#optList').addEventListener('change',e=>{const k=e.target.dataset.k;e.target.checked?SEL.add(k):SEL.delete(k);calc()});
$('#cx').addEventListener('click',e=>{const b=e.target.closest('button');if(b){CX=+b.dataset.f;calc()}});
$('#c-val').value=PP.budget||20000000;$('#c-val').addEventListener('input',calc);
function costRange(keys,cx,val){const sz=val>100e6?1.6:val>30e6?1.3:val>5e6?1.1:1;const rows=COSTS.filter(c=>keys.includes(c.k)).map(c=>({n:tx(c),lo:c.lo*cx*sz,hi:c.hi*cx*sz}));return{rows,lo:rows.reduce((a,b)=>a+b.lo,0),hi:rows.reduce((a,b)=>a+b.hi,0)}}
function calc(){$$('#cx button').forEach(b=>b.classList.toggle('on',+b.dataset.f===CX));const val=+$('#c-val').value||0;const R=costRange([...SEL],CX,val);
 $('#cTotal').textContent=R.rows.length?`${fmt(R.lo/1000)}–${fmt(R.hi/1000)} ${t('c_k')}`:t('c_pick');
 $('#cShare').textContent=val&&R.rows.length?t('c_share').replace('{a}',(R.lo/val*100).toFixed(2)).replace('{b}',(R.hi/val*100).toFixed(2)):'';
 const mx=Math.max(1,...R.rows.map(r=>r.hi));
 $('#cBars').innerHTML=R.rows.map(r=>`<div class="bar"><div class="lb"><span>${r.n}</span><span>${fmt(r.lo)}–${fmt(r.hi)} ${t('sar')}</span></div><div class="tr"><div class="fl" style="inset-inline-start:${r.lo/mx*100}%;width:${(r.hi-r.lo)/mx*100}%"></div><div class="fl" style="inset-inline-start:0;width:${r.lo/mx*100}%;opacity:.25"></div></div></div>`).join('');
 lastSum=`MAKAN — ${t('cost_h')}\n${R.rows.map(r=>`- ${r.n}: ${fmt(r.lo)}–${fmt(r.hi)} ${t('sar')}`).join('\n')}\n= ${fmt(R.lo)}–${fmt(R.hi)} ${t('sar')}`}
$('#cCopy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(lastSum);toast(t('copied'))}catch(e){toast(t('copy_fail'))}});

/* ---------- AI assistant ---------- */
let HIST=[],busy=false,ctrl=null;const msgs=$('#msgs');
const QS={ar:[['g_elig',['هل أستطيع كمستثمر أجنبي تملك عقار تجاري في الرياض؟ وما الذي أتحقق منه أولًا؟','ما المستندات التي أجهزها قبل التواصل مع محامٍ؟']],['g_inv',['رتّب لي خطة من خمس خطوات بناءً على جوازي','ما الذي يفحصه صندوق أجنبي قبل شراء مبنى مكاتب في الرياض؟']],['g_svc',['رشّح لي مزودين مناسبين لمدينتي','كم تقريبًا تكلفة الفحص القانوني والتقييم والفحص الهندسي؟']]],
 en:[['g_elig',['Can a foreign investor own commercial property in Riyadh? What should I check first?','Which documents should I prepare before speaking to a lawyer?']],['g_inv',['Build me a five-step plan based on my passport','What should a foreign fund check before buying an office building in Riyadh?']],['g_svc',['Suggest providers for my city','Roughly what do legal review, valuation and inspection cost?']]]};
function md(s){const Ls=esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').split('\n');let h='',inl=false;for(const l of Ls){const m=l.match(/^\s*(?:[-•*]|\d+[.)])\s+(.*)/);if(m){if(!inl){h+='<ul>';inl=true}h+=`<li>${m[1]}</li>`}else{if(inl){h+='</ul>';inl=false}if(l.trim())h+=`<p>${l.replace(/^#+\s*/,'')}</p>`}}return h+(inl?'</ul>':'')}
function bubble(cls,html){const d=document.createElement('div');d.className='m '+cls;d.innerHTML=html;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;return d}
function hello(){msgs.innerHTML='';HIST=[];bubble('bot',md(t('ai_hello')))}
function renderSuggest(){$('#suggest').innerHTML=QS[L].map(g=>`<div class="grp"><b>${t(g[0])}</b><div class="chips">${g[1].map(q=>`<button type="button" class="chip">${esc(q)}</button>`).join('')}</div></div>`).join('')}
$('#suggest').addEventListener('click',e=>{const c=e.target.closest('.chip');if(c){$('#q').value=c.textContent;ask()}});
$('#clearChat').addEventListener('click',()=>{if(ctrl)ctrl.abort();hello()});
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask()}});
$('#q').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=Math.min(140,e.target.scrollHeight)+'px'});
$('#chatForm').addEventListener('submit',e=>{e.preventDefault();ask()});
function setStatus(){const s=$('#aiStatus');s.classList.toggle('live',!!sample);s.lastElementChild.textContent=sample===undefined?t('ai_init'):sample?t('ai_live'):t('ai_off')}
const SYS=()=>`You are "MAKAN Assistant", an advisory assistant inside MAKAN, a platform that connects investors in Saudi real estate (especially foreign investors) with professional service providers.
Rules:
- Reply in the language of the user's message (Arabic or English). The site is currently shown in ${L==='en'?'English':'Arabic'}.
- Be concise and polished: one opening sentence, then bullet points starting with "- ". Use **bold** sparingly. No tables, no # headings.
- Your areas: initial eligibility, the investment path (stations: ${STAGES.map(s=>s.en).join(', ')}), services and experts, indicative costs.

- To suggest providers use the find_providers tool only and never invent names; say profiles marked unverified have not had their licence reviewed. For costs use estimate_costs and say the figures are illustrative.
- End with one next step inside MAKAN (Investor passport, Providers, Cost library, Journey, Kingdom map).
City keys: ${CITIES.map(c=>c.k+'='+c.en).join(', ')}. Category keys: ${Object.entries(CATS).map(([k,v])=>k+'='+v.en).join(', ')}.
Investor passport: ${PP.name||PP.nat?JSON.stringify({name:PP.name,type:TYPES[PP.type].en,nationality:PP.nat,asset:ASSETS[PP.asset].en,city:CITY(PP.city).en,stage:STAGES[PP.stage].en,value_sar:PP.budget,language:LANGS[PP.lang].en}):'not filled in yet; ask for investor type, city and asset if needed.'}`;
const TOOLS=[
 {name:'find_providers',description:'Search the MAKAN provider directory. category: legal|eng|val|adv|pm|all. city: riyadh|jeddah|dammam|makkah|madinah|all.',inputSchema:{type:'object',properties:{category:{type:'string'},city:{type:'string'}}},execute:({category,city})=>findProv(category,city).slice(0,12).map(p=>({name_ar:p.nameAr,name_en:p.nameEn,category:CATS[p.cat]?.en,city:CITY(p.city)?.en,services:pSvc(p),languages:p.langs,licence_reviewed:!!p.verified}))},
 {name:'estimate_costs',description:'Illustrative cost range in SAR. services: array of legal|val|eng|adv|pm. complexity: 1, 1.35 or 1.8. asset_value in SAR.',inputSchema:{type:'object',properties:{services:{type:'array',items:{type:'string'}},complexity:{type:'number'},asset_value:{type:'number'}},required:['services']},execute:({services,complexity,asset_value})=>{const R=costRange(services||[],complexity||1.35,asset_value||+PP.budget||0);return{illustrative:true,rows:R.rows.map(r=>({service:r.n,low:Math.round(r.lo),high:Math.round(r.hi)})),total_low:Math.round(R.lo),total_high:Math.round(R.hi)}}}];
function offline(q){const en=!/[؀-ۿ]/.test(q);
 if(/أهلية|تملك|نظام|قانون|eligib|own|law/i.test(q))return en?'To check initial eligibility we need **your investor type and nationality**, **the property type and location**, and **the intended use**.\n- Check with the Real Estate General Authority and official bodies\n- Speak to a licensed lawyer before committing\nNext step: fill in your investor passport.':'للتحقق من الأهلية الأولية نحتاج: **صفتك وجنسيتك**، **نوع العقار وموقعه**، و**طبيعة الاستخدام**.\n- راجع الهيئة العامة للعقار والجهات الرسمية\n- استشر محاميًا مرخّصًا قبل أي التزام\nالخطوة التالية: عبّئ جواز المستثمر.';
 if(/تكلف|تكاليف|رسوم|سعر|cost|fee|price/i.test(q)){const R=costRange(['legal','val','eng'],1.35,+PP.budget||0);return en?`Illustrative range for legal review, valuation and inspection: **${fmt(R.lo)}–${fmt(R.hi)} SAR**.\nNext step: adjust it in the cost library.`:`تقدير افتراضي للفحص القانوني والتقييم والفحص الهندسي: **${fmt(R.lo)}–${fmt(R.hi)} ر.س**.\nالخطوة التالية: عدّل الخيارات في مكتبة التكاليف.`}
 if(/مزود|محام|هندس|مقيّم|خبير|رشّح|provider|lawyer|suggest/i.test(q)){const Lst=findProv('all',PP.city);return (en?`From the directory in ${CITY(PP.city).en}:\n`:`من دليل المنصة في ${CITY(PP.city).ar}:\n`)+(Lst.map(p=>`- **${en?(p.nameEn||p.nameAr):(p.nameAr||p.nameEn)}** — ${en?CATS[p.cat].en:CATS[p.cat].ar}`).join('\n')||'—')}
 return en?'Let us build a first path: what kind of investor are you, and which asset, city and stage? Fill in the investor passport and I will use it.':'لنبنِ مسارًا أوليًا: ما صفتك كمستثمر، وما نوع العقار والمدينة والمرحلة؟ عبّئ جواز المستثمر وسأستخدمه في إجاباتي.'}
async function ask(){const q=$('#q').value.trim();if(!q||busy)return;$('#q').value='';$('#q').style.height='auto';bubble('me',esc(q));
 const b=bubble('bot',`<span class="mut">${t('ai_thinking')}</span>`);busy=true;$('#sendBtn').disabled=true;
 const done=()=>{busy=false;$('#sendBtn').disabled=false;msgs.scrollTop=msgs.scrollHeight};
 if(!sample||!SESSION){const a=offline(q);b.innerHTML=md(a)+`<p class="mut" style="font-size:13px;margin-top:8px">${sb?t('ai_limited'):''}</p>`;HIST.push({role:'user',content:q},{role:'assistant',content:a});return done()}
 ctrl=new AbortController();
 const context={site_language:L==='en'?'English':'Arabic',passport:PP.name||PP.nat?{name:PP.name,type:TYPES[PP.type].en,nationality:PP.nat,asset:ASSETS[PP.asset].en,city:CITY(PP.city).en,stage:STAGES[PP.stage].en,value_sar:PP.budget,language:LANGS[PP.lang].en}:null,
  stations:STAGES.map(s=>s.en),providers:PROVS.slice(0,80).map(p=>({name_ar:p.nameAr,name_en:p.nameEn,category:CATS[p.cat].en,city:CITY(p.city).en,services:p.svcEn.length?p.svcEn:p.svcAr,languages:p.langs,licence_reviewed:!!p.verified})),
  illustrative_costs_sar:COSTS.map(c=>({service:c.en,low:c.lo,high:c.hi})),complexity_multipliers:{simple:1,moderate:1.35,complex:1.8}};
 try{const r=await fetch('/api/chat',{method:'POST',signal:ctrl.signal,headers:{'content-type':'application/json',authorization:'Bearer '+SESSION.access_token},body:JSON.stringify({messages:[...HIST.slice(-10),{role:'user',content:q}],context})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){b.innerHTML=`<p>${r.status===429?t('err_rate'):t('err_gen')}</p>`;return done()}
  b.innerHTML=md(j.text||'');HIST.push({role:'user',content:q},{role:'assistant',content:j.text||''})}
 catch(e){if(e&&e.name==='AbortError')b.remove();else b.innerHTML=`<p>${t('err_gen')}</p>`}
 done()}

<div class="field"><label for="${pre}-cat">${t('a_cat')}</label><select id="${pre}-cat">${opts(CATS)}</select></div><div class="field"><label for="${pre}-city">${t('a_city')}</label><select id="${pre}-city">${CITIES.map(c=>`<option value="${c.k}">${tx(c)}</option>`).join('')}</select></div>
<div class="field"><label for="${pre}-langs">${t('a_langs')}</label><input id="${pre}-langs" placeholder="العربية, English"></div><div class="field"><label for="${pre}-resp">${t('a_resp')}</label><select id="${pre}-resp">${opts(RESP)}</select></div>

function writeP(pre,p){const s=(k,v)=>{const el=$(`#${pre}-${k}`);if(el)el.value=v??''};s('nameAr',p.nameAr);s('nameEn',p.nameEn);s('cat',p.cat||'legal');s('city',p.city||'riyadh');s('langs',p.langs);s('resp',p.resp||'d1');s('svcAr',(p.svcAr||[]).join('\n'));s('svcEn',(p.svcEn||[]).join('\n'))}

async function loadProviders(){try{PROVS=must(await sb.from('providers').select('*').order('created_at',{ascending:true})).map(fromRow);provMode='db'}catch(e){PROVS=DEMO;provMode='demo'}renderProv();renderAdmin();drawMap();cityPanel()}
async function loadApps(){if(!ADMIN)return;try{APPS=must(await sb.from('applications').select('*').eq('status','pending').order('created_at',{ascending:true})).map(fromRow)}catch(e){APPS=[]}renderAdmin()}
async function loadMyApp(){if(!UID)return;try{const d=must(await sb.from('applications').select('*').eq('user_id',UID).maybeSingle());MYAPP=d?fromRow(d):null}catch(e){MYAPP=null}renderJoin()}
async function afterAuth(session){SESSION=session||null;const u=SESSION?SESSION.user:null;UID=u?u.id:null;
 ME=u?{id:u.id,email:u.email||'',name:(u.user_metadata&&u.user_metadata.full_name)||(u.email||'').split('@')[0],avatarUrl:avatar(u.email)}:null;
 ADMIN=false;cloud=false;MYAPP=null;APPS=[];
 if(UID){try{ADMIN=!!must(await sb.from('admins').select('user_id').eq('user_id',UID).maybeSingle())}catch(e){}
  try{const d=must(await sb.from('passports').select('pp,tasks').eq('user_id',UID).maybeSingle());cloud=true;if(d){if(d.pp)PP=Object.assign({},DEF,d.pp);if(Array.isArray(d.tasks))DONE=d.tasks;selCity=PP.city}}catch(e){cloud=false}
  await loadMyApp();await loadApps()}
 sample=UID?true:null;applyLang()}
function standalone(){const st=document.createElement('style');st.textContent='#acct,.joinband,a[href="#join"],a[href="#account"],#navAdmin{display:none!important}';document.head.appendChild(st)}

/* ---------- boot ---------- */
sample=undefined;applyLang();route();
(async()=>{
 let cfg=null;try{const r=await fetch('/api/config');if(r.ok)cfg=await r.json()}catch(e){}
 if(!cfg||!cfg.url||!cfg.anon||!window.supabase){sample=null;standalone();applyLang();return}
 sb=window.supabase.createClient(cfg.url,cfg.anon,{auth:{flowType:'pkce',detectSessionInUrl:true,persistSession:true}});
 provMode='loading';renderProv();
 await loadProviders();
 const {data}=await sb.auth.getSession();
 if(/[?&]code=/.test(location.search))history.replaceState(null,'',location.pathname+location.hash);
 await afterAuth(data?data.session:null);
 sb.auth.onAuthStateChange((ev,s)=>{const id=s&&s.user?s.user.id:null;if(id!==UID)setTimeout(()=>afterAuth(s),0);else SESSION=s});
})();
}
</script>
</body>
